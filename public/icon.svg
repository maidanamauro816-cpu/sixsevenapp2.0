<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#450a0a" stop-opacity="0.8" />
      <stop offset="60%" stop-color="#171717" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#000000" stop-opacity="1" />
    </radialGradient>
    <filter id="neonRed" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" fill="#000000" rx="100" />
  <rect width="512" height="512" fill="url(#bgGlow)" rx="100" />

  <!-- Outer Neon Border Ring -->
  <rect x="16" y="16" width="480" height="480" rx="84" fill="none" stroke="#ef4444" stroke-width="6" stroke-opacity="0.4" />

  <!-- Centered 6 7 Typography (Kept strictly inside safe zone for maskable icons) -->
  <g transform="translate(256, 260)" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900">
    <!-- Glow behind the 7 -->
    <text x="65" y="65" font-size="240" fill="#ef4444" filter="url(#neonRed)" opacity="0.6">7</text>

    <!-- White '6' -->
    <text x="-70" y="65" font-size="240" fill="#ffffff" letter-spacing="-8">6</text>

    <!-- Neon Red '7' -->
    <text x="75" y="65" font-size="240" fill="#ff0000" letter-spacing="-8">7</text>
  </g>

  <!-- Bottom Accent Tag -->
  <g transform="translate(256, 420)">
    <rect x="-80" y="-18" width="160" height="34" rx="17" fill="#ef4444" fill-opacity="0.2" stroke="#ff0000" stroke-width="2" />
    <text x="0" y="5" font-family="system-ui, sans-serif" font-weight="900" font-size="16" fill="#ff4d4d" text-anchor="middle" letter-spacing="4">TIKTOK</text>
  </g>
</svg>
