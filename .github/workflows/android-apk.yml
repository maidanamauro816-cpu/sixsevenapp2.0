name: Build SixSeven Android APK

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - feature/sixseven-fix-photos-ai-status

permissions:
  contents: read

jobs:
  android-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm install --no-audit --no-fund --legacy-peer-deps

      - name: Build web app
        run: npm run build
        env:
          VITE_GIPHY_API_KEY: ${{ secrets.GIPHY_API_KEY }}

      - name: Generate Android project
        run: npx cap add android

      - name: Generate SixSeven launcher icon and splash screen
        run: npx capacitor-assets generate --android

      - name: Configure Firebase Android file
        run: |
          if [ -f google-services.json ]; then
            mkdir -p android/app
            cp google-services.json android/app/google-services.json
          else
            echo "::warning::google-services.json is missing; native Google/phone sign-in may need Firebase setup."
          fi

      - name: Apply SixSeven Android permissions and fixed signing
        run: python3 scripts/patch_android.py

      - name: Sync Capacitor web assets and plugins
        run: npx cap sync android

      - name: Build Android APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Verify APK exists
        run: test -s android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SixSeven-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
