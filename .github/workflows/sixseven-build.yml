name: SixSeven build
on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feature/sixseven-chat-media]
permissions:
  contents: read
jobs:
  web-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Generate official SixSeven icons
        run: |
          npm install --no-save --no-audit --no-fund sharp
          node scripts/generate-icons.mjs
      - name: Build web app
        run: npm run build
        env:
          VITE_GIPHY_API_KEY: ${{ secrets.GIPHY_API_KEY }}
