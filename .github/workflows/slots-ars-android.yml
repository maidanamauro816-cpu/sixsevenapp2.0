name: SixSeven Slots ARS Android
on:
  push:
    branches: [feature/slots-ars]
    paths:
      - 'app/**'
      - '.github/workflows/slots-ars-android.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  android-debug:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package.json
      - name: Install dependencies
        run: npm install
      - name: TypeScript check
        run: npx tsc --noEmit
      - name: Generate Android project
        run: CI=1 npx expo prebuild --platform android --clean
      - name: Build debug APK
        working-directory: app/android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: SixSeven-Slots-ARS-debug
          path: app/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
