name: Verify SixSeven

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - feature/sixseven-fix-photos-ai-status

jobs:
  web-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install app dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund
      - name: TypeScript check
        run: npm run lint
      - name: Build web app
        run: npm run build
      - name: Install Firebase Function dependencies
        run: npm install --prefix functions --legacy-peer-deps --no-audit --no-fund
      - name: Check Firebase Function syntax
        run: node --check functions/index.js
