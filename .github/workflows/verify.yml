name: Verify SixSeven

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - feature/sixseven-fix-photos-ai-status

jobs:
  web-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install app dependencies
        run: npm install --no-audit --no-fund
      - name: Generate official SixSeven icons
        run: |
          npm install --no-save --no-audit --no-fund sharp
          node scripts/generate-icons.mjs
      - name: TypeScript check
        run: npm run lint
      - name: Build web app
        run: npm run build
