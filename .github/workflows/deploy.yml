name: Deploy SixSeven Backblaze Worker

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "cloudflare/backblaze-worker/**"
      - ".github/workflows/deploy.yml"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Worker dependencies
        working-directory: cloudflare/backblaze-worker
        run: npm install --no-audit --no-fund

      - name: Validate secrets, configure Cloudflare Worker secrets and deploy
        working-directory: cloudflare/backblaze-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
          B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
          B2_APP_KEY: ${{ secrets.B2_APP_KEY }}
          B2_BUCKET_NAME: ${{ secrets.B2_BUCKET_NAME }}
          B2_ENDPOINT: ${{ secrets.B2_ENDPOINT }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Falta CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::Falta CLOUDFLARE_ACCOUNT_ID"; exit 1; }
          test -n "$B2_KEY_ID" || { echo "::error::Falta B2_KEY_ID"; exit 1; }
          B2_SECRET="${B2_APP_KEY:-$B2_APPLICATION_KEY}"
          test -n "$B2_SECRET" || { echo "::error::Falta B2_APP_KEY o B2_APPLICATION_KEY"; exit 1; }

          API="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/sixseven-backblaze-signer/secrets"
          put_secret() {
            local secret_name="$1"
            local secret_value="$2"
            local payload
            payload="$(jq -n --arg name "$secret_name" --arg text "$secret_value" '{name:$name,text:$text,type:"secret_text"}')"
            local http_code
            http_code="$(curl -sS -o /tmp/cf-secret-response.json -w '%{http_code}' -X PUT "$API" \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              -H "Content-Type: application/json" \
              --data "$payload")"
            if { [ "$http_code" != "200" ] && [ "$http_code" != "201" ]; } || ! jq -e '.success == true' /tmp/cf-secret-response.json >/dev/null; then
              echo "::error::Cloudflare no aceptó el secreto $secret_name (HTTP $http_code). Revisá el permiso Workers Scripts Edit del token."
              jq -r '.errors[]?.message // empty' /tmp/cf-secret-response.json || true
              exit 1
            fi
            echo "Secreto configurado: $secret_name"
          }

          put_secret "B2_KEY_ID" "$B2_KEY_ID"
          put_secret "B2_APP_KEY" "$B2_SECRET"
          put_secret "B2_APPLICATION_KEY" "$B2_SECRET"
          if [ -n "$B2_BUCKET_NAME" ]; then put_secret "B2_BUCKET_NAME" "$B2_BUCKET_NAME"; fi
          if [ -n "$B2_ENDPOINT" ]; then put_secret "B2_ENDPOINT" "$B2_ENDPOINT"; fi

          npx wrangler deploy --name sixseven-backblaze-signer --account-id "$CLOUDFLARE_ACCOUNT_ID"

      - name: Verify live Worker endpoints
        env:
          WORKER_URL: https://sixseven-backblaze-signer.sixsevenapp816.workers.dev
        shell: bash
        run: |
          set -euo pipefail
          for path in / /api/health; do
            code="$(curl -sS -o /tmp/health.json -w '%{http_code}' --max-time 20 "$WORKER_URL$path")"
            cat /tmp/health.json
            echo
            test "$code" = "200" || { echo "::error::Health check failed at $path with HTTP $code"; exit 1; }
            grep -q '"ok":true' /tmp/health.json || { echo "::error::Unexpected health response at $path"; exit 1; }
          done
          OPTIONS_CODE="$(curl -sS -o /dev/null -w '%{http_code}' -X OPTIONS "$WORKER_URL/api/upload-avatar" -H 'Origin: https://example.com' -H 'Access-Control-Request-Method: POST' -H 'Access-Control-Request-Headers: authorization,content-type')"
          test "$OPTIONS_CODE" = "200" || { echo "::error::CORS preflight failed with HTTP $OPTIONS_CODE"; exit 1; }

      - name: Publish deployment summary
        run: |
          {
            echo "## SixSeven Backblaze Worker"
            echo
            echo "- URL: https://sixseven-backblaze-signer.sixsevenapp816.workers.dev"
            echo "- Health: https://sixseven-backblaze-signer.sixsevenapp816.workers.dev/api/health"
            echo "- Avatar upload: POST /api/upload-avatar"
            echo "- Cover upload: POST /api/upload-cover"
            echo "- Legacy signed upload: POST /upload-url"
          } >> "$GITHUB_STEP_SUMMARY"
