name: Deploy SixSeven Backblaze Worker

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "cloudflare/backblaze-worker/**"
      - ".github/workflows/deploy.yml"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Worker dependencies
        working-directory: cloudflare/backblaze-worker
        run: npm install --no-audit --no-fund

      - name: Validate secrets and deploy Worker
        working-directory: cloudflare/backblaze-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
          B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
          B2_APP_KEY: ${{ secrets.B2_APP_KEY }}
          B2_BUCKET_NAME: ${{ secrets.B2_BUCKET_NAME }}
          B2_ENDPOINT: ${{ secrets.B2_ENDPOINT }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Falta CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::Falta CLOUDFLARE_ACCOUNT_ID"; exit 1; }
          test -n "$B2_KEY_ID" || { echo "::error::Falta B2_KEY_ID"; exit 1; }
          B2_SECRET="${B2_APP_KEY:-$B2_APPLICATION_KEY}"
          test -n "$B2_SECRET" || { echo "::error::Falta B2_APP_KEY o B2_APPLICATION_KEY"; exit 1; }

          printf '%s' "$B2_KEY_ID" | npx wrangler secret put B2_KEY_ID --name sixseven-backblaze-signer --account-id "$CLOUDFLARE_ACCOUNT_ID"
          printf '%s' "$B2_SECRET" | npx wrangler secret put B2_APP_KEY --name sixseven-backblaze-signer --account-id "$CLOUDFLARE_ACCOUNT_ID"
          printf '%s' "$B2_SECRET" | npx wrangler secret put B2_APPLICATION_KEY --name sixseven-backblaze-signer --account-id "$CLOUDFLARE_ACCOUNT_ID"

          if [ -n "$B2_BUCKET_NAME" ]; then
            printf '%s' "$B2_BUCKET_NAME" | npx wrangler secret put B2_BUCKET_NAME --name sixseven-backblaze-signer --account-id "$CLOUDFLARE_ACCOUNT_ID"
          fi
          if [ -n "$B2_ENDPOINT" ]; then
            printf '%s' "$B2_ENDPOINT" | npx wrangler secret put B2_ENDPOINT --name sixseven-backblaze-signer --account-id "$CLOUDFLARE_ACCOUNT_ID"
          fi

          npx wrangler deploy --name sixseven-backblaze-signer --account-id "$CLOUDFLARE_ACCOUNT_ID"

      - name: Verify live Worker endpoints
        env:
          WORKER_URL: https://sixseven-backblaze-signer.sixsevenapp816.workers.dev
        shell: bash
        run: |
          set -euo pipefail
          for path in / /api/health; do
            code="$(curl -sS -o /tmp/health.json -w '%{http_code}' --max-time 20 "$WORKER_URL$path")"
            cat /tmp/health.json
            echo
            test "$code" = "200" || { echo "::error::Health check failed at $path with HTTP $code"; exit 1; }
            grep -q '"ok":true' /tmp/health.json || { echo "::error::Unexpected health response at $path"; exit 1; }
          done
          OPTIONS_CODE="$(curl -sS -o /dev/null -w '%{http_code}' -X OPTIONS "$WORKER_URL/api/upload-avatar" -H 'Origin: https://example.com' -H 'Access-Control-Request-Method: POST' -H 'Access-Control-Request-Headers: authorization,content-type')"
          test "$OPTIONS_CODE" = "200" || { echo "::error::CORS preflight failed with HTTP $OPTIONS_CODE"; exit 1; }

      - name: Publish deployment summary
        run: |
          {
            echo "## SixSeven Backblaze Worker"
            echo
            echo "- URL: https://sixseven-backblaze-signer.sixsevenapp816.workers.dev"
            echo "- Health: https://sixseven-backblaze-signer.sixsevenapp816.workers.dev/api/health"
            echo "- Avatar upload: POST /api/upload-avatar"
            echo "- Cover upload: POST /api/upload-cover"
            echo "- Legacy signed upload: POST /upload-url"
          } >> "$GITHUB_STEP_SUMMARY"
