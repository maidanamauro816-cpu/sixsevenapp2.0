name: Verify SixSeven Backblaze Worker

on:
  push:
    paths:
      - 'cloudflare/backblaze-worker/**'
      - '.github/workflows/verify-backblaze-worker.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudflare/backblaze-worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cloudflare/backblaze-worker/package.json
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: TypeScript check
        run: npx tsc --noEmit
      - name: Cloudflare bundle dry run
        run: npx wrangler deploy --dry-run
