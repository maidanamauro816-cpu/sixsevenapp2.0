name: Deploy SixSeven Backblaze Worker

on:
  push:
    branches: [main]
    paths:
      - "cloudflare/backblaze-worker/**"
      - ".github/workflows/deploy-backblaze-worker.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-worker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Worker dependencies
        working-directory: cloudflare/backblaze-worker
        run: npm install --no-audit --no-fund
      - name: Configure Cloudflare secrets
        working-directory: cloudflare/backblaze-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
          B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo "Falta el secreto CLOUDFLARE_API_TOKEN" && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo "Falta el secreto CLOUDFLARE_ACCOUNT_ID" && exit 1)
          test -n "$B2_KEY_ID" || (echo "Falta el secreto B2_KEY_ID" && exit 1)
          test -n "$B2_APPLICATION_KEY" || (echo "Falta el secreto B2_APPLICATION_KEY" && exit 1)
          printf '%s' "$B2_KEY_ID" | npx wrangler secret put B2_KEY_ID --account-id "$CLOUDFLARE_ACCOUNT_ID"
          printf '%s' "$B2_APPLICATION_KEY" | npx wrangler secret put B2_APPLICATION_KEY --account-id "$CLOUDFLARE_ACCOUNT_ID"
      - name: Deploy Worker
        working-directory: cloudflare/backblaze-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --account-id "$CLOUDFLARE_ACCOUNT_ID"
